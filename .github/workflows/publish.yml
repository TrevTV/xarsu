name: Build and Publish xarsu

on: [push, pull_request]

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract Version
        id: get_version
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Pack xarsu.Reference
        run: |
          dotnet build reference/ -c Release
          dotnet pack reference/ -c Release \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -o ./bin/NuGet

      - name: Build and Pack xarsu.HookGenerator
        run: |
          dotnet build hookgenerator/ -c Release
          dotnet pack hookgenerator/ -c Release \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -o ./bin/NuGet

      - name: Build and Pack xarsu.Generator
        run: |
          dotnet build generator/ -c Release
          dotnet pack generator/ -c Release \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -o ./bin/NuGet

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xarsu-packages
          path: ./bin/NuGet/*.nupkg

      - name: Push to NuGet
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push ./bin/NuGet/*.nupkg \
            --skip-duplicate \
            --api-key ${{ secrets.NUGET_TOKEN }} \
            --source "https://nuget.trev.app/v3/index.json"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./bin/NuGet/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}